<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pre-order MARS Robot | Innate</title>
  <meta name="description" content="Reserve your MARS personal robot second batch unit ($1,999)." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="virtual-protocol-site-verification" content="7d4424024829fe8dc7d22400dc1c8002" />
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar-innate dark">
    <div style="display: flex; align-items: center; gap: 24px;">
      <a href="index.html" class="brand-badge" style="gap: 10px;">
        <img src="logo.png" alt="Innate logo" style="width: 32px; height: 32px; border-radius: 6px; object-fit: contain;">
        <span class="brand-wordmark">innate</span>
      </a>

      <div class="nav-links-innate" style="margin-left: 20px;">
        <a href="docs.html" class="nav-item">Docs</a>
        <a href="about.html" class="nav-item">About</a>
        <a href="https://x.com/innatebot_" target="_blank" class="nav-item">𝕏 @innatebot_</a>
      </div>
    </div>

    <button class="btn-blue" onclick="openPreorderModal()">Pre-order</button>
  </nav>

  <main style="padding: 140px 0 100px; background: var(--bg-white);">
    <div class="container" style="max-width: 600px;">
      <h1 style="font-family: var(--font-display); font-size: 2.8rem; font-weight: 700; margin-bottom: 16px; text-align: center;">Reserve MARS Batch 2</h1>
      <p style="font-family: var(--font-mono); color: var(--text-secondary); text-align: center; margin-bottom: 36px;">
        Join the second batch of MARS personal AI robot shipments ($1,999 USD). Priority delivery Q4 2026.
      </p>

      <div style="background: var(--bg-gray); padding: 36px; border-radius: var(--radius-lg); border: 1px solid rgba(0, 0, 0, 0.08);">
        <form onsubmit="submitPreorder(event)">
          <div style="margin-bottom: 18px;">
            <label style="font-family: var(--font-mono); font-size: 0.82rem; font-weight: 600; display: block; margin-bottom: 6px;">FULL NAME</label>
            <input type="text" placeholder="John Doe" required style="width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: var(--font-mono);" />
          </div>

          <div style="margin-bottom: 18px;">
            <label style="font-family: var(--font-mono); font-size: 0.82rem; font-weight: 600; display: block; margin-bottom: 6px;">EMAIL ADDRESS</label>
            <input type="email" placeholder="john@example.com" required style="width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: var(--font-mono);" />
          </div>

          <div style="margin-bottom: 24px;">
            <label style="font-family: var(--font-mono); font-size: 0.82rem; font-weight: 600; display: block; margin-bottom: 6px;">SHIPPING COUNTRY</label>
            <select style="width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: var(--font-mono);">
              <option>United States ($1,999 USD)</option>
              <option>Canada ($1,999 USD)</option>
              <option>Europe ($1,999 USD)</option>
              <option>Asia Pacific / International ($1,999 USD)</option>
            </select>
          </div>

          <button type="submit" class="btn-blue" style="width: 100%; padding: 14px 0;">
            Confirm Reservation ($1,999)
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer-innate">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 24px;">
      <div>
        <div style="font-family: var(--font-mono); font-weight: 800; font-size: 1.4rem; color: #fff; margin-bottom: 8px;">innate</div>
        <p style="font-family: var(--font-mono); font-size: 0.85rem; color: rgba(255, 255, 255, 0.6);">&copy; 2026 Innate Robotics Inc. All rights reserved.</p>
      </div>

      <div class="nav-links-innate" style="color: #fff;">
        <a href="docs.html" class="nav-item">Docs</a>
        <a href="about.html" class="nav-item">About</a>
        <a href="https://x.com/innatebot_" target="_blank" class="nav-item">𝕏 @innatebot_</a>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
